services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: susmeter
      POSTGRES_PASSWORD: susmeter
      POSTGRES_DB: susmeter
    ports:
      - '5432:5432'
    volumes:
      - susmeter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U susmeter -d susmeter']
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:4000'
      PYTHONUNBUFFERED: '1'
    ports:
      - '8000:8000'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://susmeter:susmeter@postgres:5432/susmeter?schema=public'
      JWT_SECRET: '${JWT_SECRET:-change-this-before-deploying}'
      JWT_EXPIRES_IN: '7d'
      API_PORT: '4000'
      ML_SERVICE_URL: 'http://ml:8000'
      WEB_ORIGIN: 'http://localhost:5173'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  susmeter-postgres:
